<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- The real title is injected at runtime from HELP_CONFIG.title (see app.js)
     so this shell never hard-codes a project name. -->
<title>Help</title>
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div id="app">

  <div id="explorer">
    <div id="explorer-header">
      <!-- Text content is set from HELP_CONFIG.title at runtime. -->
      <div id="explorer-title">Help</div>
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input id="search-input" type="text" placeholder="Search help topics…" autocomplete="off" spellcheck="false">
        <span id="search-clear" class="search-clear" title="Clear search">✕</span>
      </div>
      <div id="search-meta"></div>
    </div>
    <div id="tree"></div>
  </div>

  <!-- role/aria/tabindex make the splitter keyboard-operable (Left/Right/Shift+Arrow/
       Home/End/Enter — see app.js). aria-valuenow is kept in sync with the current
       explorer width. -->
  <div id="splitter"
       title="Drag to resize (arrow keys to adjust, Enter to reset, Home/End for min/max)"
       tabindex="0"
       role="separator"
       aria-orientation="vertical"
       aria-label="Resize help topics panel"
       aria-valuenow="220"
       aria-valuemin="160"
       aria-valuemax="480"></div>

  <div id="detail-wrap">
    <div id="breadcrumb"></div>
    <div id="detail"></div>
  </div>

</div>

<!-- content.js is generated by build_help.py from help/manifest.json + help/content/**/*.md.
     It must be loaded before app.js and must define HELP_CATEGORIES + HELP_CONFIG. -->
<script src="assets/content.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
